<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">B 线性 DP 移动端概念板</title>
  <desc id="desc">390 像素宽的 Warm Ink 深色移动端方案，以简化索引轨道、序列脊线和 LIS 课程图版展示关键信息。</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#82ab9f"/>
      <stop offset="1" stop-color="#5f8b7e"/>
    </linearGradient>
    <linearGradient id="plane" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#82ab9f" stop-opacity=".34"/>
      <stop offset="1" stop-color="#5f8b7e" stop-opacity=".02"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ece7de" stroke-opacity=".04"/>
    </pattern>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0L7 3.5L0 7Z" fill="#6fb6c6"/>
    </marker>
    <style>
      .ui{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}
      .display{font-family:"Space Grotesk","Noto Sans SC","Microsoft YaHei",sans-serif}
      .mono{font-family:"JetBrains Mono","Cascadia Code",monospace}
      .muted{fill:#a7a097}.faint{fill:#6e685f}.ink{fill:#ece7de}.accent{fill:#82ab9f}
    </style>
  </defs>
  <rect width="390" height="844" fill="#0b0a09"/>
  <rect width="390" height="844" fill="url(#grid)"/>

  <g transform="translate(20 18)">
    <rect width="30" height="30" rx="8" fill="#121010" stroke="#82ab9f" stroke-opacity=".5"/>
    <path d="M15 6L19 11L24 15L19 19L15 24L11 19L6 15L11 11Z" fill="url(#accent)"/>
    <circle cx="15" cy="15" r="2.5" fill="#0b0a09"/>
    <text x="42" y="20" class="display ink" font-size="17" font-weight="700">DP大师</text>
    <text x="330" y="19" class="mono faint" font-size="9" text-anchor="end">B / 07</text>
  </g>
  <path d="M0 66H390" stroke="#ece7de" stroke-opacity=".1"/>

  <g transform="translate(22 104)">
    <text class="mono accent" font-size="10" letter-spacing="2">PART B · INDEXED RECURRENCE</text>
    <text y="61" class="display ink" font-size="48" font-weight="720" letter-spacing="-2">线性 DP</text>
    <text y="93" class="ui muted" font-size="14">沿索引推进，让当前状态接住前驱。</text>
  </g>

  <!-- Simplified mobile sculpture -->
  <g transform="translate(20 218)">
    <rect width="350" height="238" rx="18" fill="#121010" stroke="#ece7de" stroke-opacity=".1"/>
    <circle cx="188" cy="113" r="92" fill="none" stroke="#ece7de" stroke-opacity=".08"/>
    <path d="M25 194H326M52 36V205M112 36V205M172 36V205M232 36V205M292 36V205" fill="none" stroke="#ece7de" stroke-opacity=".06"/>
    <path d="M50 176L110 124L170 153L230 68L290 96L290 184L50 184Z" fill="url(#plane)"/>
    <path d="M50 176L110 124L170 153L230 68L290 96" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M58 169C116 146 185 97 220 74" fill="none" stroke="#6fb6c6" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrow)"/>
    <path d="M240 62C257 61 270 72 283 88" fill="none" stroke="#93c06b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g>
      <circle cx="50" cy="176" r="8" fill="#121010" stroke="#82ab9f" stroke-width="2"/>
      <circle cx="110" cy="124" r="8" fill="#121010" stroke="#82ab9f" stroke-width="2"/>
      <circle cx="170" cy="153" r="8" fill="#121010" stroke="#82ab9f" stroke-width="2"/>
      <circle cx="230" cy="68" r="11" fill="#ef9f5e" stroke="#121010" stroke-width="3"/>
      <circle cx="290" cy="96" r="11" fill="#93c06b" stroke="#121010" stroke-width="3"/>
    </g>
    <g class="mono faint" font-size="9" text-anchor="middle">
      <text x="50" y="207">0</text><text x="110" y="207">1</text><text x="170" y="207">2</text><text x="230" y="207">3</text><text x="290" y="207">4</text>
    </g>
    <text x="20" y="24" class="mono accent" font-size="9" letter-spacing="1.4">INDEX RAIL</text>
  </g>

  <g transform="translate(22 492)" class="ui">
    <rect width="164" height="48" rx="10" fill="url(#accent)"/>
    <text x="20" y="30" fill="#221708" font-size="13" font-weight="720">从第一课开始</text>
    <path d="M130 24H146M140 18L146 24L140 30" fill="none" stroke="#221708" stroke-width="1.8"/>
    <text x="184" y="29" class="muted" font-size="12">7 门课程</text>
  </g>

  <!-- Mobile lesson atom -->
  <g transform="translate(20 576)">
    <text class="mono accent" font-size="9" letter-spacing="1.5">PILOT PLATE · LIS</text>
    <rect y="20" width="350" height="214" rx="18" fill="#121010" stroke="#ece7de" stroke-opacity=".1"/>
    <g transform="translate(24 48)">
      <text class="ui ink" font-size="16" font-weight="650">最长上升子序列</text>
      <text y="23" class="ui muted" font-size="11">前驱链 + tails 最小结尾</text>
      <path d="M0 108H300" stroke="#ece7de" stroke-opacity=".12"/>
      <path d="M16 98L72 66L128 82L184 38L240 54L288 18" fill="none" stroke="#6fb6c6" stroke-width="2"/>
      <g fill="#121010" stroke="#82ab9f" stroke-width="2">
        <circle cx="16" cy="98" r="6"/><circle cx="72" cy="66" r="6"/><circle cx="128" cy="82" r="6"/>
        <circle cx="184" cy="38" r="6"/><circle cx="240" cy="54" r="6"/><circle cx="288" cy="18" r="6"/>
      </g>
      <circle cx="184" cy="38" r="7" fill="#ef9f5e"/>
      <circle cx="288" cy="18" r="7" fill="#93c06b"/>
      <g transform="translate(16 132)">
        <rect width="42" height="10" rx="5" fill="#82ab9f" opacity=".28"/>
        <rect x="50" y="-7" width="42" height="17" rx="5" fill="#82ab9f" opacity=".42"/>
        <rect x="100" y="-16" width="42" height="26" rx="5" fill="#82ab9f" opacity=".56"/>
        <rect x="150" y="-26" width="42" height="36" rx="5" fill="#82ab9f" opacity=".72"/>
        <text x="286" y="8" class="mono faint" font-size="9" text-anchor="end">tails[len]</text>
      </g>
    </g>
  </g>
</svg>
